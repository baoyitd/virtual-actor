<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Actor — 角色产品原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --sidebar-w: 220px;
    --primary-900: #0F172A;
    --primary-800: #1E293B;
    --primary-700: #334155;
    --primary-600: #475569;
    --primary-50: #F8FAFC;
    --accent: #0EA5E9;
    --accent-light: #38BDF8;
    --accent-glow: rgba(14,165,233,0.15);
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-light: #94A3B8;
    --green: #22C55E;
    --blue: #3B82F6;
    --amber: #F59E0B;
    --red: #EF4444;
    --gray: #94A3B8;
    --border: #E2E8F0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);
    --transition: 200ms cubic-bezier(0.4,0,0.2,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'PingFang SC', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; display: flex; min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--primary-600); border-radius: 3px; }

  /* Sidebar */
  .sidebar { width: var(--sidebar-w); background: linear-gradient(180deg, var(--primary-900) 0%, var(--primary-800) 100%); color: #E2E8F0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; }
  .sidebar-logo { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; }
  .sidebar-logo .icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .sidebar-logo h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .sidebar-logo span { font-size: 11px; color: var(--text-light); }
  .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); color: var(--text-light); font-size: 13px; font-weight: 500; text-decoration: none; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #E2E8F0; }
  .nav-item.active { background: var(--accent-glow); color: var(--accent-light); }
  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 11px; color: var(--text-light); }

  /* Main */
  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .page-header { padding: 24px 32px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .page-header h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
  .page-header .breadcrumb { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .page-body { flex: 1; padding: 24px 32px; overflow-y: auto; }

  /* Page transition */
  .page { display: none; animation: fadeIn 200ms ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Status badges */
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }
  .status-draft { background: #F1F5F9; color: #64748B; }
  .status-test { background: #EFF6FF; color: #3B82F6; }
  .status-published { background: #F0FDF4; color: #22C55E; }
  .status-archived { background: #FFF7ED; color: #F59E0B; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-draft .status-dot { background: #94A3B8; }
  .status-test .status-dot { background: #3B82F6; }
  .status-published .status-dot { background: #22C55E; }
  .status-archived .status-dot { background: #F59E0B; }

  /* Cards */
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); transition: all var(--transition); }
  .card:hover { box-shadow: var(--shadow-md); }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  .card-body { padding: 20px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); border: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #0284C7; box-shadow: 0 2px 8px rgba(14,165,233,0.3); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: #E2E8F0; }
  .btn-ghost { background: transparent; color: var(--text-secondary); }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #DC2626; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 24px; font-size: 14px; }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; color: var(--text); background: var(--card); transition: border var(--transition); font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
  .form-input.error { border-color: var(--red); }
  .form-error { font-size: 11px; color: var(--red); margin-top: 4px; }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

  /* Filter tabs */
  .filter-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .filter-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all var(--transition); border: 1px solid var(--border); background: var(--card); color: var(--text-secondary); }
  .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Role cards grid */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .role-card { cursor: pointer; overflow: hidden; }
  .role-card-inner { padding: 20px; }
  .role-card-avatar { width: 48px; height: 48px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--primary-800), var(--primary-700)); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
  .role-card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .role-card-title { font-size: 16px; font-weight: 600; }
  .role-card-bio { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .role-card-meta { display: flex; gap: 16px; font-size: 11px; color: var(--text-light); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .role-card-actions { display: flex; gap: 4px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* Accordion */
  .accordion { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; background: var(--card); }
  .accordion-header { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; transition: background var(--transition); user-select: none; }
  .accordion-header:hover { background: var(--bg); }
  .accordion-header .arrow { transition: transform var(--transition); font-size: 12px; color: var(--text-light); }
  .accordion.open .accordion-header .arrow { transform: rotate(180deg); }
  .accordion-body { padding: 0 20px 20px; display: none; }
  .accordion.open .accordion-body { display: block; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); animation: fadeIn 150ms ease; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 90%; max-width: 720px; max-height: 80vh; display: flex; flex-direction: column; animation: slideUp 200ms ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  /* Knowledge item */
  .knowledge-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; transition: all var(--transition); }
  .knowledge-item:hover { border-color: var(--accent); background: rgba(14,165,233,0.03); }
  .knowledge-item.selected { border-color: var(--accent); background: rgba(14,165,233,0.06); }
  .knowledge-item .check { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--transition); }
  .knowledge-item.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 10px; }
  .knowledge-info { flex: 1; min-width: 0; }
  .knowledge-title { font-weight: 500; font-size: 13px; margin-bottom: 3px; }
  .knowledge-meta { font-size: 11px; color: var(--text-light); display: flex; gap: 8px; }

  /* Test page */
  .test-layout { display: flex; gap: 20px; height: calc(100vh - 160px); }
  .chat-panel { flex: 3; display: flex; flex-direction: column; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .chat-bubble { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 13px; line-height: 1.6; }
  .chat-bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .chat-bubble.role { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
  .chat-bubble-header { font-size: 11px; font-weight: 600; margin-bottom: 4px; opacity: 0.7; }
  .chat-input-area { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .chat-input-area input { flex: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: 24px; font-size: 13px; outline: none; }
  .chat-input-area input:focus { border-color: var(--accent); }
  .chat-input-area button { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; font-size: 16px; transition: all var(--transition); }
  .chat-input-area button:hover { background: #0284C7; }
  .source-panel { flex: 2; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; }
  .source-panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .source-panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .source-item { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .source-item-title { font-weight: 600; font-size: 12px; margin-bottom: 6px; }
  .source-item-snippet { font-size: 11px; color: var(--text-secondary); line-height: 1.5; background: var(--bg); padding: 8px; border-radius: 4px; font-style: italic; border-left: 3px solid var(--accent); }

  /* Version timeline */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .timeline-item { position: relative; padding-bottom: 20px; }
  .timeline-dot { position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }
  .timeline-date { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
  .timeline-content { font-size: 13px; }

  /* Detail grid */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .detail-card-label { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
  .detail-card-value { font-size: 13px; line-height: 1.6; }

  /* Empty state */
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
  .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .empty-state p { color: var(--text-secondary); margin-bottom: 20px; }

  /* Tags */
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; background: #F1F5F9; color: #475569; margin: 2px 3px; }
  .tag.blue { background: #EFF6FF; color: #2563EB; }
  .tag.green { background: #F0FDF4; color: #16A34A; }

  /* Toolbar fixed bottom */
  .toolbar-fixed { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 0 -32px -24px; }

  /* Version table */
  .version-table { width: 100%; border-collapse: collapse; }
  .version-table th { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 16px; text-align: left; border-bottom: 2px solid var(--border); font-weight: 600; }
  .version-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .version-table tr:hover td { background: var(--bg); }
  .version-table .expandable { cursor: pointer; }
  .version-detail-row { display: none; }
  .version-detail-row.open { display: table-row; }
  .version-detail-row td { background: var(--bg); font-size: 12px; padding: 16px 32px; }
</style>
</head>

  </div>
</div>

// ===================== ROUTING =====================
function navigate(page, roleId) {
  let hash = '#page/' + page;
  if (roleId) hash += '/' + roleId;
  window.location.hash = hash;
}

function handleRoute() {
  const hash = window.location.hash.replace('#', '');
  const parts = hash.split('/');
  const page = parts[1] || 'role-list';
  const roleId = parts[2];

  // Update sidebar
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`[data-page="${page}"]`);
  if (navItem) navItem.classList.add('active');

  // Show page
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const pageEl = document.getElementById('page-' + (page === 'role-edit' ? 'role-edit' : page === 'role-create' ? 'role-edit' : page === 'role-detail' ? 'role-detail' : page === 'role-test' ? 'role-test' : page === 'role-publish' ? 'role-publish' : 'role-list'));
  if (pageEl) {
    pageEl.classList.add('active');
    if (pageEl.id === 'page-role-list') pageEl.style.display = 'block';
  }

  // Render
  switch(page) {
    case 'role-list': renderRoleList(); break;
    case 'role-create': renderRoleEdit(null); break;
    case 'role-edit': renderRoleEdit(roleId); break;
    case 'role-detail': renderRoleDetail(roleId); break;
    case 'role-test': renderRoleTest(roleId); break;
    case 'role-publish': renderRolePublish(roleId); break;
    default: navigate('role-list');
  }
}

window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', () => { if (!window.location.hash) navigate('role-list'); else handleRoute(); });

// ===================== UTILS =====================
function getStatusBadge(status) {
  const labels = { draft:'草稿', test:'测试中', published:'已发布', archived:'已归档' };
  return `<span class="status-badge status-${status}"><span class="status-dot"></span>${labels[status] || status}</span>`;
}

function getDecisionStyleLabel(style) {
  const m = { conservative:'保守型', balanced:'平衡型', aggressive:'激进型' };
  return m[style] || style;
}

function getRoleById(id) { return appState.roles.find(r => r.id === id); }

// ===================== PAGE: ROLE LIST =====================
function renderRoleList(filterStatus) {
  filterStatus = filterStatus || appState._listFilter || 'all';
  appState._listFilter = filterStatus;
  let roles = filterStatus === 'all' ? appState.roles : appState.roles.filter(r => r.status === filterStatus);
  const statuses = ['all','draft','test','published','archived'];
  const labels = { all:'全部', draft:'草稿', test:'测试中', published:'已发布', archived:'已归档' };
  const counts = {};
  statuses.forEach(s => { counts[s] = s === 'all' ? appState.roles.length : appState.roles.filter(r => r.status === s).length; });

  let html = '';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">';
  html += '<div class="filter-tabs">';
  statuses.forEach(s => {
    html += `<div class="filter-tab ${filterStatus === s ? 'active' : ''}" onclick="setListFilter('${s}')">${labels[s]} <span style="opacity:0.7;font-size:11px;">${counts[s]}</span></div>`;
  });
  html += '</div>';
  html += `<button class="btn btn-primary btn-lg" onclick="navigate('role-create')">➕ 新建角色</button>`;
  html += '</div>';

  if (roles.length === 0) {
    html += `<div class="empty-state card"><div class="empty-icon">🎭</div><h3>还没有角色</h3><p>创建你的第一个虚拟角色，开始构建专家团队</p><button class="btn btn-primary" onclick="navigate('role-create')">创建角色</button></div>`;
  } else {
    html += '<div class="role-grid">';
    roles.forEach(r => {
      const kCount = r.knowledge_refs.length;
      html += `<div class="card role-card" onclick="navigate('role-detail','${r.id}')">`;
      html += `<div class="role-card-inner">`;
      html += `<div class="role-card-header">`;
      html += `<div class="role-card-avatar">${r.avatar_initials}</div>`;
      html += `<div style="flex:1;min-width:0;">`;
      html += `<div style="display:flex;align-items:center;gap:8px;"><span class="role-card-title">${r.name}</span>${getStatusBadge(r.status)}</div>`;
      html += `<div class="role-card-bio">${r.bio || '暂无简介'}</div>`;
      html += `</div></div>`;
      html += `<div class="role-card-meta"><span>📚 ${kCount} 条知识</span><span>🕐 ${new Date(r.updated_at).toLocaleDateString('zh-CN')}</span></div>`;
      html += `<div class="role-card-actions" onclick="event.stopPropagation()">`;
      html += `<button class="btn btn-ghost btn-sm" onclick="navigate('role-edit','${r.id}')">编辑</button>`;
      if (r.status !== 'published') html += `<button class="btn btn-ghost btn-sm" onclick="navigate('role-test','${r.id}')">测试</button>`;
      if (r.status === 'test') html += `<button class="btn btn-primary btn-sm" onclick="navigate('role-publish','${r.id}')">发布</button>`;
      if (r.status === 'published') html += `<button class="btn btn-secondary btn-sm" onclick="archiveRole('${r.id}')">归档</button>`;
      if (r.status === 'archived') html += `<button class="btn btn-ghost btn-sm" onclick="restoreRole('${r.id}')">恢复</button>`;
      html += `</div></div></div>`;
    });
    html += '</div>';
  }
  document.getElementById('roleListBody').innerHTML = html;
}

function setListFilter(status) { appState._listFilter = status; renderRoleList(status); }

function archiveRole(id) { const r = getRoleById(id); if (r && r.status === 'published') { r.status = 'archived'; renderRoleList(appState._listFilter); } }
function restoreRole(id) { const r = getRoleById(id); if (r && r.status === 'archived') { r.status = 'draft'; renderRoleList(appState._listFilter); } }

  if (isEdit) {
    const role = getRoleById(appState.editingRoleId);
    if (role) {
      Object.assign(role, data, { updated_at: new Date().toISOString() });
    }
  } else {
    const id = 'role-' + Date.now();
    const initials = name.split('').filter(c => /[\u4e00-\u9fa5]/.test(c)).slice(0,2).join('') || name.substring(0,2).toUpperCase();
    appState.roles.push({
      id, ...data, status:'draft', current_version:null, avatar_initials:initials,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(), versions:[]
    });
  }
  appState.editingRoleId = null;
  navigate('role-list');
}

function showFormError(fieldId, msg) {
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.classList.add('error');
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  const existErr = el.parentElement.querySelector('.form-error');
  if (existErr) existErr.remove();
  const err = document.createElement('div');
  err.className = 'form-error'; err.textContent = msg;
  el.parentElement.appendChild(err);
  el.addEventListener('input', () => { el.classList.remove('error'); const e = el.parentElement.querySelector('.form-error'); if(e) e.remove(); }, { once:true });
}

// ===================== KNOWLEDGE MODAL =====================
function openKnowledgeModal() {
  appState._knowledgeFilter = { status:'all', type:'all' };
  document.getElementById('knowledgeModal').classList.add('open');
  renderKnowledgeModal();
}
function closeKnowledgeModal() { document.getElementById('knowledgeModal').classList.remove('open'); }

function renderKnowledgeModal() {
  const f = appState._knowledgeFilter || { status:'all', type:'all' };
  let items = [...appState.knowledgeItems];
  if (f.status !== 'all') items = items.filter(k => k.status === f.status);
  if (f.type !== 'all') items = items.filter(k => k.type === f.type);

  let html = '';
  html += '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">';
  ['all','reviewed','published','archived'].forEach(s => {
    html += `<div class="filter-tab ${f.status===s?'active':''}" style="font-size:11px;" onclick="appState._knowledgeFilter.status='${s}';renderKnowledgeModal();">${s==='all'?'全部状态':s}</div>`;
  });
  html += '<span style="color:var(--border);margin:0 4px;">|</span>';
  ['all','reference','note','summary'].forEach(t => {
    html += `<div class="filter-tab ${f.type===t?'active':''}" style="font-size:11px;" onclick="appState._knowledgeFilter.type='${t}';renderKnowledgeModal();">${t==='all'?'全部类型':t}</div>`;
  });
  html += '</div>';

  items.forEach(k => {
    const selected = appState.tempKnowledgeSelection.includes(k.id);
    html += `<div class="knowledge-item ${selected?'selected':''}" onclick="toggleKnowledgeSelect('${k.id}')">`;
    html += `<div class="check">${selected?'✓':''}</div>`;
    html += `<div class="knowledge-info"><div class="knowledge-title">${k.title}</div><div class="knowledge-meta"><span class="tag green">${k.type}</span>${getStatusBadge(k.status)}<span>${k.tags.map(t=>'<span class="tag blue">'+t+'</span>').join('')}</span></div>`;
    html += `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${k.summary}</div></div></div>`;
  });

  document.getElementById('knowledgeModalBody').innerHTML = html || '<div style="text-align:center;padding:40px;color:var(--text-light);">无匹配的知识条目</div>';
  document.getElementById('knowledgeCount').textContent = `已选 ${appState.tempKnowledgeSelection.length} 个知识条目`;
}

function toggleKnowledgeSelect(kid) {
  const idx = appState.tempKnowledgeSelection.indexOf(kid);
  if (idx >= 0) appState.tempKnowledgeSelection.splice(idx, 1);
  else appState.tempKnowledgeSelection.push(kid);
  renderKnowledgeModal();
}

function confirmKnowledgeBinding() {
  closeKnowledgeModal();
  // Refresh knowledge list in edit form
  const listEl = document.getElementById('ef-knowledge-list');
  if (!listEl) return;
  if (appState.tempKnowledgeSelection.length === 0) {
    listEl.innerHTML = '<div style="color:var(--text-light);font-size:13px;padding:8px 0;">暂未绑定知识</div>';
  } else {
    listEl.innerHTML = appState.tempKnowledgeSelection.map(kid => {
      const k = appState.knowledgeItems.find(ki => ki.id === kid);
      if (!k) return '';
      return `<div class="knowledge-item" style="cursor:default;border-color:var(--accent);background:rgba(14,165,233,0.03);"><div class="check" style="background:var(--accent);border-color:var(--accent);color:#fff;font-size:10px;">✓</div><div class="knowledge-info"><div class="knowledge-title">${k.title}</div><div class="knowledge-meta"><span class="tag green">${k.type}</span><span class="tag blue">${k.tags[0]}</span></div></div></div>`;
    }).join('');
  }
}

  html += `<div style="margin-top:8px;"><div class="detail-card-label">协作模式</div><div class="detail-card-value">${r.collaboration_mode === 'independent' ? '独立决策' : r.collaboration_mode === 'delegatable' ? '可委派' : '仅咨询'}</div></div>`;

// ===================== PAGE: ROLE TEST =====================
function renderRoleTest(roleId) {
  const r = getRoleById(roleId);
  if (!r) { navigate('role-list'); return; }
  document.getElementById('testPageTitle').textContent = '测试：' + r.name;

  let html = '<div class="test-layout">';
  // Chat panel
  html += '<div class="chat-panel">';
  html += '<div class="chat-messages" id="chatMessages">';

  // Pre-filled demo conversations
  const demos = [
    { role:'user', text:'请分析这份财务报告中的主要风险点。' },
    { role:'actor', text:'基于已绑定的《企业财务审计标准指引》，我识别出以下三个关键风险点：\n\n1. **应收账款周转率下降**：近三个季度从4.2降至2.8，低于行业均值3.5，提示回款能力弱化。\n2. **流动比率偏低**：当前1.15，接近警戒线。建议关注短期偿债压力。\n3. **研发费用资本化比例异常**：本期资本化率从往期15%跃升至32%，需审计核实是否符合〈企业会计准则第6号〉第7条。\n\n以上判断置信度约75%，建议与审计底稿交叉验证。', sources:['k-001'] },
    { role:'user', text:'研发费用资本化的判断依据是什么？' },
    { role:'actor', text:'《企业财务审计标准指引》第五章第3.2节明确规定：\n\n研发费用资本化需同时满足：\n- 技术可行性已完成论证\n- 有明确的市场应用计划\n- 具备足够的资源完成开发\n- 支出能够可靠计量\n\n若该公司无法提供上述四项的完整记录，建议将该部分费用转回损益表。', sources:['k-001'] }
  ];

  demos.forEach((msg, i) => {
    if (msg.role === 'user') {
      html += `<div class="chat-bubble user"><div class="chat-bubble-header">🧑 你</div>${msg.text}</div>`;
    } else {
      html += `<div class="chat-bubble role"><div class="chat-bubble-header">🎭 ${r.name}</div>${msg.text.replace(/\n/g,'<br>')}</div>`;
    }
  });

  html += '</div>';
  html += '<div class="chat-input-area">';
  html += `<input type="text" placeholder="输入测试问题..." id="testInput" onkeypress="if(event.key==='Enter')sendTestMessage()">`;
  html += `<button onclick="sendTestMessage()">➤</button>`;
  html += '</div>';
  html += '</div>';

  // Source panel
  html += '<div class="source-panel">';
  html += '<div class="source-panel-header">📖 知识溯源</div>';
  html += '<div class="source-panel-body">';
  (r.knowledge_refs || []).forEach(kid => {
    const k = appState.knowledgeItems.find(ki => ki.id === kid);
    if (k) html += `<div class="source-item"><div class="source-item-title">📄 ${k.title}</div><div class="source-item-snippet">${k.summary}</div></div>`;
  });
  if ((r.knowledge_refs||[]).length === 0) html += '<div style="color:var(--text-light);font-size:12px;text-align:center;padding:20px;">角色未绑定知识</div>';
  html += '</div></div>';

  html += '</div>';
  document.getElementById('roleTestBody').innerHTML = html;
}

function sendTestMessage() {
  const input = document.getElementById('testInput');
  if (!input || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = '';
  const container = document.getElementById('chatMessages');
  if (!container) return;
  container.innerHTML += `<div class="chat-bubble user"><div class="chat-bubble-header">🧑 你</div>${text}</div>`;
  container.innerHTML += `<div class="chat-bubble role"><div class="chat-bubble-header">🎭 角色</div>这是模拟回复，实际运行时将基于角色绑定的知识库和LLM配置生成回答。</div>`;
  container.scrollTop = container.scrollHeight;
}

// ===================== PAGE: ROLE PUBLISH =====================
function renderRolePublish(roleId) {
  const r = getRoleById(roleId);
  if (!r) { navigate('role-list'); return; }
  document.getElementById('publishPageTitle').textContent = '发布：' + r.name;

  let html = '';
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;"><div class="role-card-avatar" style="width:48px;height:48px;font-size:22px;">${r.avatar_initials}</div><div><h3 style="font-size:18px;font-weight:600;">${r.name}</h3><div style="display:flex;align-items:center;gap:8px;margin-top:4px;">${getStatusBadge(r.status)}<span style="font-size:12px;color:var(--text-light);">当前: ${r.current_version || '无版本'}</span></div></div></div>`;

  // Non-test status hint
  if (r.status !== 'test') {
    html += `<div class="card" style="margin-bottom:20px;"><div class="card-body" style="text-align:center;padding:40px;color:var(--text-secondary);">`;
    if (r.status === 'draft') html += '⏳ 角色仍在草稿状态，请先完善配置并进入测试。';
    else if (r.status === 'published') html += '✅ 角色已发布，当前版本：' + r.current_version;
    else if (r.status === 'archived') html += '📦 角色已归档。';
    html += '</div></div>';
  } else {
    html += '<div class="card" style="margin-bottom:20px;"><div class="card-header">🚀 发布确认</div><div class="card-body">';
    html += '<div class="form-group"><label class="form-label">发布说明 *</label><textarea class="form-textarea" id="pub-notes" placeholder="描述本次发布的变更内容" style="min-height:80px;"></textarea></div>';
    html += '<button class="btn btn-primary btn-lg" onclick="publishRole()">✅ 确认发布</button>';
    html += '</div></div>';
  }

  // Version history
  if (r.versions.length > 0) {
    html += '<div class="card"><div class="card-header">📜 版本历史</div><div class="card-body">';
    html += '<table class="version-table"><thead><tr><th>版本号</th><th>发布时间</th><th>发布说明</th></tr></thead><tbody>';
    r.versions.forEach(v => {
      html += `<tr><td><strong>${v.number}</strong></td><td>${new Date(v.published_at).toLocaleString('zh-CN')}</td><td>${v.notes}</td></tr>`;
    });
    html += '</tbody></table></div></div>';
  }

  document.getElementById('rolePublishBody').innerHTML = html;
}

function publishRole() {
  const roleId = appState.editingRoleId || window.location.hash.split('/')[2];
  const r = getRoleById(roleId);
  if (!r || r.status !== 'test') return;
  const notes = document.getElementById('pub-notes')?.value?.trim();
  if (!notes) { if(document.getElementById('pub-notes')) { document.getElementById('pub-notes').classList.add('error'); setTimeout(()=>document.getElementById('pub-notes').classList.remove('error'),2000); } return; }

  const verNum = 'v' + (r.versions.length + 1) + '.0';
  r.versions.unshift({ id:'ver-' + Date.now(), number:verNum, published_at:new Date().toISOString(), notes });
  r.status = 'published';
  r.current_version = verNum;
  r.validated_knowledge_versions = r.knowledge_refs.map(kid => ({ kid, version:'current', validated_at:new Date().toISOString() }));
  navigate('role-list');
}

// ── API Backend Integration ──
const API_BASE = 'http://localhost:8000';
async function apiHealth() { try { const r = await fetch(API_BASE+'/health'); return r.ok; } catch { return false; } }

// 页面加载时检测后端连通性
(async () => {
  const ok = await apiHealth();
  const indicator = document.createElement('div');
  indicator.id = 'api-status';
  indicator.style.cssText = `position:fixed;bottom:12px;right:12px;padding:4px 12px;border-radius:20px;font-size:11px;font-family:Inter,sans-serif;z-index:9999;`;
  indicator.style.background = ok ? '#22C55E20' : '#EF444420';
  indicator.style.color = ok ? '#16A34A' : '#DC2626';
  indicator.style.border = `1px solid ${ok ? '#22C55E40' : '#EF444440'}`;
  indicator.textContent = ok ? '🟢 API 已连接' : '🔴 API 未连接';
  document.body.appendChild(indicator);
})();

// CRUD helpers (可被原型页面脚本调用)
async function loadRoles() {
  const r = await fetch(API_BASE+'/role-assets');
  return r.json();
}
async function createRole(data) {
  const r = await fetch(API_BASE+'/role-assets', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
  });
  return r.json();
}
